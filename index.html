<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#1c1f24; --dim:#6b7280; --line:#e3e6ea;
  --accent:#2563eb; --warn:#b45309; --hl:#fde68a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);color:var(--ink);
  font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif}
code,.mono{font-family:"Cascadia Mono",Consolas,"Courier New",monospace}
header{flex:none;max-height:52vh;overflow:auto;z-index:20;background:var(--card);
  border-bottom:1px solid var(--line);padding:14px 20px 10px;
  box-shadow:0 1px 3px rgba(0,0,0,.05)}
h1{margin:0 0 2px;font-size:17px;font-weight:650;letter-spacing:.2px}
.sub{color:var(--dim);font-size:12px;margin-bottom:10px}
.sub b{color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.bar .lbl{color:var(--dim);font-size:12px;min-width:54px;flex:none}
.chip{border:1px solid var(--line);background:#fafbfc;border-radius:999px;
  padding:3px 11px;font-size:12px;cursor:pointer;user-select:none;white-space:nowrap;
  transition:.12s}
.chip:hover{border-color:#c3c9d1;background:#f2f4f7}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .n{opacity:.65;margin-left:5px;font-variant-numeric:tabular-nums}
.chip.on .n{opacity:.8}
.chip.c0chip{border-style:dashed}
.chip.ovchip{border-color:#f0b429;background:#fffbeb;color:#92400e}
.chip.ovchip.on{background:#b45309;border-color:#b45309;color:#fff}
#q{flex:1;min-width:220px;border:1px solid var(--line);border-radius:6px;
  padding:6px 10px;font-size:13px;font-family:inherit;background:#fff}
#q:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
button.act{border:1px solid var(--line);background:#fff;border-radius:6px;
  padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
button.act:hover{border-color:#c3c9d1;background:#f7f8fa}
.count{margin-left:auto;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.count b{color:var(--ink);font-size:13px}
main{flex:1;min-height:0;overflow:auto;padding:14px 20px 60px}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);
  border:1px solid var(--line);border-radius:8px;table-layout:fixed}
thead th{position:sticky;top:0;z-index:10;background:#f0f2f5;text-align:left;
  font-size:12px;font-weight:600;color:#4b5563;padding:8px 10px;
  border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;
  background-clip:padding-box}
thead th:first-child{border-radius:7px 0 0 0}
thead th:last-child{border-radius:0 7px 0 0}
thead th:hover{background:#e8ebef}
thead th .ar{color:var(--accent);font-size:10px}
tbody td{padding:9px 10px;border-bottom:1px solid #eef0f3;vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#fcfdfe}
tr.ovr td{background:#fffdf5}
tr.ovr:hover td{background:#fffaeb}
tr.ovr td:first-child{box-shadow:inset 3px 0 0 #f0b429}
tr.c0 .ttl,tr.c0 .prev,tr.c0 .full{opacity:.6}
.c-id{width:132px}.c-seq{width:38px;text-align:center}
.c-cat{width:148px}.c-fix{width:88px}.c-dec{width:200px}.c-rep{width:64px;text-align:center}
td.c-id{font-family:"Cascadia Mono",Consolas,monospace;font-size:13px;color:#374151}
.sname{margin-top:2px;font-family:inherit;font-size:12px;line-height:1.35;
  color:var(--dim);word-break:break-word}
td.c-seq{color:var(--dim);font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;
  white-space:nowrap;border:1px solid transparent}
.C1{background:#fee2e2;color:#991b1b}.C2{background:#ffedd5;color:#9a3412}
.C3{background:#fef3c7;color:#92400e}.C4{background:#dcfce7;color:#166534}
.C5{background:#d1fae5;color:#065f46}.C6{background:#cffafe;color:#155e75}
.C7{background:#e0e7ff;color:#3730a3}.C8{background:#fae8ff;color:#701a75}
.C9{background:#f1f5f9;color:#334155;border-color:#e2e8f0}
.C0{background:#e5e7eb;color:#4b5563;border-color:#d1d5db}
.C10{background:#fafaf9;color:#78716c;border-color:#d6d3d1;border-style:dashed}
.CX{background:#ecfdf5;color:#047857;border-color:#a7f3d0;border-style:dashed}
.CY{background:#f5f3ff;color:#6d28d9;border-color:#ddd6fe;border-style:dashed}
.f-0{background:#eff6ff;color:#1d4ed8}
.f-1{background:#f0fdf4;color:#15803d}
.f-2{background:#fff7ed;color:#c2410c}
select.cs,select.ds{font:inherit;font-size:11px;line-height:1.5;padding:1px 3px;
  max-width:100%;border-radius:4px;border:1px solid rgba(0,0,0,.12);cursor:pointer}
select.ds{width:100%}
select.cs:focus,select.ds:focus{outline:2px solid var(--accent);outline-offset:1px}
.d-{background:#fff;color:#6b7280;border-style:dashed;border-color:#cbd5e1}
.d-agree{background:#dcfce7;color:#14532d;border-color:#86efac}
.d-mine{background:#dbeafe;color:#1e3a8a;border-color:#93c5fd}
.d-tbd{background:#fee2e2;color:#7f1d1d;border-color:#fca5a5}
textarea.dn{width:100%;margin-top:5px;font:inherit;font-size:12px;line-height:1.55;
  border:1px solid #93c5fd;border-radius:4px;padding:5px 6px;resize:vertical;
  min-height:64px;background:#f8fbff;color:#1e3a8a}
textarea.dn:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.dnhint{color:#9ca3af;font-size:10px;margin-top:3px}
.dnok{color:#15803d}
.ovb{display:inline-block;margin-left:4px;font-size:10px;color:#92400e;
  background:#fef3c7;border:1px solid #fde68a;border-radius:3px;padding:0 4px;
  cursor:help;vertical-align:top}
.ttl{font-weight:600;color:#111827;margin-bottom:3px}
.prev{color:#4b5563;font-size:13px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.full{font-size:13px;color:#374151;white-space:pre-wrap;
  background:#fbfcfd;border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:0 6px 6px 0;padding:10px 12px;margin-top:4px;line-height:1.75}
.full code{background:#eef1f5;padding:1px 5px;border-radius:3px;font-size:12px;color:#0f172a}
.full b{color:#111827}
mark{background:var(--hl);padding:0 1px;border-radius:2px}
.rep a{color:var(--accent);text-decoration:none;font-size:12px}
.rep a:hover{text-decoration:underline}
.meta{color:#9ca3af;font-size:11px;margin-top:6px}
.empty{padding:50px;text-align:center;color:var(--dim)}
body.v-unit .c-cn,body.v-unit .c-cr,body.v-unit .c-nat{display:none}
body.v-char .c-fix,body.v-char .c-rep{display:none}
body.v-unit .charbar{display:none}
body.v-char .fixbar{display:none}
.c-cn{width:118px;font-weight:600}
.c-cr{width:52px;text-align:center}
.c-nat{width:48px;text-align:center;color:var(--dim);font-variant-numeric:tabular-nums}
.r-N{background:#f3f4f6;color:#4b5563;border-color:#e5e7eb}
.r-R{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
.r-SR{background:#f5f3ff;color:#6d28d9;border-color:#ddd6fe}
.r-SSR{background:#fffbeb;color:#b45309;border-color:#fde68a}
.r-UR{background:#fff1f2;color:#be123c;border-color:#fecdd3}
.r-none{background:#fafafa;color:#9ca3af;border-color:#eee;border-style:dashed}
#chsel{border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;
  font-family:inherit;background:#fff;max-width:200px}
.vchip{font-weight:600}
@media (max-width:1100px){.c-fix,.c-rep{display:none}}
</style></head><body>
<header>
  <h1 id="h1"></h1>
  <div class="sub" id="sub"></div>
  <div class="bar"><span class="lbl" data-ui="lblV"></span><span id="fv"></span></div>
  <div class="bar"><span class="lbl" data-ui="lblC"></span><span id="fc"></span><span id="fo"></span></div>
  <div class="bar fixbar"><span class="lbl" data-ui="lblF"></span><span id="ff"></span></div>
  <div class="bar charbar"><span class="lbl" data-ui="lblCh"></span><select id="chsel"></select>
    <span class="lbl" data-ui="lblR"></span><span id="fr"></span></div>
  <div class="bar charbar"><span class="lbl" data-ui="lblN"></span><span id="fn"></span></div>
  <div class="bar"><span class="lbl" data-ui="lblD"></span><span id="fd"></span></div>
  <div class="bar">
    <input id="q">
    <button class="act" id="reset" data-ui="btReset"></button>
    <button class="act" id="fold" data-ui="btFold"></button>
    <button class="act" id="csv" data-ui="btCsv"></button>
    <button class="act" id="ovexp" data-ui="btExp"></button>
    <button class="act" id="ovimp" data-ui="btImp"></button>
    <button class="act" id="ovclr" data-ui="btClr"></button>
    <input type="file" id="fimp" accept=".tsv,.txt,.csv" hidden>
    <span class="count"><b id="shown">0</b> / <span id="tot">0</span> <span data-ui="uCond"></span> ·
      <b id="nsk">0</b> <span data-ui="uUnit"></span> · <span data-ui="uOvr"></span> <b id="novr">0</b> ·
      <span data-ui="uDec"></span> <b id="ndec">0</b></span>
  </div>
</header>
<main>
<table>
  <thead><tr>
    <th class="c-cn"  data-k="gd"><span data-ui="thCn"></span> <span class="ar"></span></th>
    <th class="c-cr"  data-k="cr"><span data-ui="thCr"></span> <span class="ar"></span></th>
    <th class="c-nat" data-k="nt"><span data-ui="thNat"></span> <span class="ar"></span></th>
    <th class="c-id"  data-k="id"><span data-ui="thId"></span> <span class="ar"></span></th>
    <th class="c-seq" data-k="seq"><span data-ui="thSeq"></span></th>
    <th class="c-cat" data-k="c"><span data-ui="thCat"></span> <span class="ar"></span></th>
    <th class="c-fix" data-k="f"><span data-ui="thFix"></span> <span class="ar"></span></th>
    <th data-k="t"><span data-ui="thTxt"></span></th>
    <th class="c-dec" data-k="d"><span data-ui="thDec"></span> <span class="ar"></span></th>
    <th class="c-rep"><span data-ui="thRep"></span></th>
  </tr></thead>
  <tbody id="tb"></tbody>
</table>
<div class="empty" id="empty" data-ui="empty" hidden></div>
</main>
<script id="DATA" type="application/json">[]</script>
<script id="META" type="application/json">{}</script>
<script>
window.SYNC = (function () {
  'use strict';
  var OWNER = 'Jiawei-Ni', REPO = 'rv-data', BRANCH = 'main';
  var API = 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/';
  var NS = 'sync.' + OWNER + '.' + REPO;
  var TOKEN = '', WHO = '', BOOT = null, APP = null;
  var REMOTE = {};      
  var SIG = {};         
  var PENDING = {};     
  var SHA = '';         
  var LASTC = '';       
  var BUSY = false, TIMER = null, POLL = 10;
  function ls(k, v) {
    try {
      if (v === undefined) return localStorage.getItem(k) || '';
      if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v);
    } catch (e) {}
    return '';
  }
  function b64enc(str) {
    var u8 = new TextEncoder().encode(str), bin = '';
    for (var i = 0; i < u8.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }
  function b64dec(s) {
    var bin = atob(String(s).replace(/\s/g, '')), u8 = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(u8);
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c];
    });
  }
  function stamp(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return '';
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  var TIMEOUT = 20000;
  function req(path, opt) {
    opt = opt || {};
    var h = opt.headers || {};
    h.Authorization = 'Bearer ' + TOKEN;
    h['X-GitHub-Api-Version'] = '2022-11-28';
    var ac = window.AbortController ? new AbortController() : null;
    var t = setTimeout(function () { if (ac) ac.abort(); }, TIMEOUT);
    return fetch(API + path, {method: opt.method || 'GET', headers: h, body: opt.body,
                              cache: 'no-store', signal: ac ? ac.signal : undefined})
      .then(function (r) { clearTimeout(t); return r; },
            function (e) {
              clearTimeout(t);
              throw new Error(
                (e && e.name === 'AbortError')
                  ? 'Cannot reach api.github.com (timed out after ' + (TIMEOUT / 1000) +
                    's). A proxy is required on this network.'
                  : 'Cannot reach api.github.com (' + ((e && e.message) || e) +
                    '). A proxy is required on this network.');
            });
  }
  function fail(r) {
    var m = {401: 'Token invalid or expired', 403: 'Token lacks permission, or rate limited',
             404: 'Not found (token may not cover this repo)'}[r.status];
    return new Error(m || ('HTTP ' + r.status));
  }
  function getRaw(file) {
    return req('contents/' + file + '?ref=' + BRANCH,
               {headers: {Accept: 'application/vnd.github.raw'}})
      .then(function (r) { if (!r.ok) throw fail(r); return r.json(); });
  }
  function getState() {
    return req('contents/state.json?ref=' + BRANCH).then(function (r) {
      if (r.status === 404) return {obj: {}, sha: ''};     
      if (!r.ok) throw fail(r);
      return r.json().then(function (j) {
        return {obj: JSON.parse(b64dec(j.content) || '{}'), sha: j.sha};
      });
    });
  }
  function headCommit() {
    return req('commits?path=state.json&per_page=1&sha=' + BRANCH).then(function (r) {
      if (!r.ok) throw fail(r);
      return r.json().then(function (a) { return (a[0] && a[0].sha) || ''; });
    });
  }
  function style() {
    if (document.getElementById('syncCSS')) return;
    var s = document.createElement('style');
    s.id = 'syncCSS';
    s.textContent = [
      '#syncbar{position:fixed;top:8px;right:12px;z-index:99;display:flex;gap:8px;',
      '  align-items:center;font-size:12px;background:#fff;border:1px solid #e3e6ea;',
      '  border-radius:999px;padding:4px 10px 4px 12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}',
      '#syncbar .dot{width:7px;height:7px;border-radius:50%;background:#16a34a;flex:none}',
      '#syncbar.busy .dot{background:#f59e0b}',
      '#syncbar.off  .dot{background:#dc2626}',
      '#syncbar b{font-weight:600}',
      '#syncbar button{border:1px solid #e3e6ea;background:#fafbfc;border-radius:6px;',
      '  padding:2px 8px;font:inherit;font-size:11px;cursor:pointer;color:#6b7280}',
      '#syncbar button:hover{background:#f2f4f7}',
      '.by{margin-top:3px;font-size:11px;color:#9ca3af;line-height:1.3}',
      '#gate{position:fixed;inset:0;z-index:200;background:#f6f7f9;display:flex;',
      '  align-items:center;justify-content:center;font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}',
      '#gate .box{width:420px;max-width:92vw;background:#fff;border:1px solid #e3e6ea;',
      '  border-radius:12px;padding:26px 26px 22px;box-shadow:0 4px 20px rgba(0,0,0,.06)}',
      '#gate h2{margin:0 0 4px;font-size:16px;font-weight:650}',
      '#gate p{margin:0 0 18px;color:#6b7280;font-size:12px}',
      '#gate label{display:block;font-size:12px;color:#6b7280;margin:12px 0 4px}',
      '#gate input{width:100%;padding:7px 10px;border:1px solid #e3e6ea;border-radius:7px;',
      '  font:inherit;font-size:13px}',
      '#gate input:focus{outline:none;border-color:#2563eb}',
      '#gate .go{width:100%;margin-top:18px;padding:9px;border:0;border-radius:7px;',
      '  background:#2563eb;color:#fff;font:inherit;font-weight:600;cursor:pointer}',
      '#gate .go:hover{background:#1d4ed8}',
      '#gate .err{margin-top:12px;color:#b91c1c;font-size:12px;min-height:16px}'
    ].join('\n');
    document.head.appendChild(s);
  }
  function bar(cls, txt) {
    var b = document.getElementById('syncbar');
    if (!b) {
      b = document.createElement('div');
      b.id = 'syncbar';
      document.body.appendChild(b);
    }
    b.className = cls || '';
    b.innerHTML = '<span class="dot"></span><span id="syncTxt">' + esc(txt || 'Synced') +
      '</span><b>' + esc(WHO) + '</b><button id="syncOut">Sign out</button>';
    document.getElementById('syncOut').onclick = function () {
      if (!confirm('Forget the saved name and token on this machine? Unpushed edits are kept.')) return;
      ls(NS + '.token', null); ls(NS + '.who', null);
      location.reload();
    };
  }
  function gate(err) {
    style();
    var g = document.getElementById('gate');
    if (!g) {
      g = document.createElement('div');
      g.id = 'gate';
      g.innerHTML =
        '<div class="box"><h2>Sign in</h2>' +
        '<p>Your name is stamped on each entry you edit. The token stays in this browser and is never uploaded.</p>' +
        '<label>Name</label><input id="gWho" autocomplete="off">' +
        '<label>Access token</label><input id="gTok" type="password" autocomplete="off" ' +
        'placeholder="github_pat_…">' +
        '<button class="go" id="gGo">Enter</button>' +
        '<div class="err" id="gErr"></div></div>';
      document.body.appendChild(g);
      var go = function () {
        var w = document.getElementById('gWho').value.trim();
        var t = document.getElementById('gTok').value.trim();
        if (!w || !t) { document.getElementById('gErr').textContent = 'Both fields are required.'; return; }
        WHO = w; TOKEN = t;
        ls(NS + '.who', w); ls(NS + '.token', t);
        document.getElementById('gErr').textContent = 'Connecting...';
        load().catch(function (e) { gate(String(e.message || e)); });
      };
      document.getElementById('gGo').onclick = go;
      g.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
    }
    g.hidden = false;
    document.getElementById('gWho').value = WHO;
    document.getElementById('gErr').textContent = err || '';
    if (err) { ls(NS + '.token', null); TOKEN = ''; }
    (WHO ? document.getElementById('gTok') : document.getElementById('gWho')).focus();
  }
  function savePending() { ls(NS + '.pending', JSON.stringify(PENDING)); }
  function loadPending() {
    try { PENDING = JSON.parse(ls(NS + '.pending') || '{}'); } catch (e) { PENDING = {}; }
  }
  function nPending() { return Object.keys(PENDING).length; }
  function schedule(ms) {
    if (TIMER) clearTimeout(TIMER);
    TIMER = setTimeout(flush, ms === undefined ? 3000 : ms);
  }
  function push(k, entry) {
    PENDING[k] = {v: entry || null};
    savePending();
    bar('busy', nPending() + ' pending');
    schedule();
  }
  function flush() {
    if (BUSY || !nPending() || !TOKEN) return Promise.resolve();
    BUSY = true;
    bar('busy', 'Syncing...');
    var snap = {};
    Object.keys(PENDING).forEach(function (k) { snap[k] = PENDING[k]; });
    var tries = 0;
    var attempt = function () {
      return getState().then(function (cur) {
        var merged = {}, now = new Date().toISOString();
        Object.keys(cur.obj).forEach(function (k) { merged[k] = cur.obj[k]; });
        Object.keys(snap).forEach(function (k) {
          var v = snap[k].v;
          if (v == null) delete merged[k];
          else merged[k] = Object.assign({}, v, {by: WHO, at: now});
        });
        return req('contents/state.json', {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            message: WHO + ' updated ' + Object.keys(snap).length + ' entries',
            content: b64enc(JSON.stringify(merged)),
            sha: cur.sha || undefined,
            branch: BRANCH
          })
        }).then(function (r) {
          if ((r.status === 409 || r.status === 422) && ++tries < 4) return attempt();
          if (!r.ok) throw fail(r);
          return r.json().then(function (j) {
            SHA = (j.content && j.content.sha) || '';
            LASTC = (j.commit && j.commit.sha) || LASTC;
            REMOTE = merged;
            Object.keys(snap).forEach(function (k) {
              if (PENDING[k] === snap[k]) delete PENDING[k];
            });
            savePending();
            apply(true);
          });
        });
      });
    };
    return attempt().then(function () {
      BUSY = false;
      bar('', nPending() ? nPending() + ' pending' : 'Synced');
      if (nPending()) schedule(500);
    }).catch(function (e) {
      BUSY = false;
      bar('off', 'Offline: ' + (e.message || e) + ' (edits kept locally)');
      schedule(20000);          
    });
  }
  function apply(doRender) {
    if (!APP) return;
    var st = {};
